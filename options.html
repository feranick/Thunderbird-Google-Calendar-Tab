<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: sans-serif;
      font-size: 14px;
      padding: 16px;
      min-width: 340px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .desc {
      color: #555;
      font-size: 12px;
      margin-top: 4px;
      margin-bottom: 16px;
    }
    #status {
      color: #2a7d2a;
      font-size: 12px;
      height: 14px;
    }
  </style>
</head>
<body>
  <div class="row">
    <input type="checkbox" id="notificationsEnabled">
    <label for="notificationsEnabled" data-i18n="optionsNotificationsLabel"></label>
  </div>
  <div class="desc" data-i18n="optionsNotificationsDesc"></div>

  <div class="row">
    <label for="leadMinutes" data-i18n="optionsLeadLabel"></label>
    <select id="leadMinutes">
      <option value="5">5</option>
      <option value="10">10</option>
      <option value="15">15</option>
      <option value="30">30</option>
      <option value="60">60</option>
    </select>
    <span data-i18n="optionsLeadUnit"></span>
  </div>

  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
